<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - JavaScript</title>
    <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

    <h1>Assignment 5. JavaScript Basics</h1>

    <section id="part1">
        <h2>Part 1. Profile Object</h2>
        <p>Name: <span id="showName"></span></p>
        <p>Birth year: <span id="showYear"></span></p>
        <p>Developer: <span id="showDev"></span></p>
        <p>Hobbies: <span id="showHobbies"></span></p>
        <p>Age: <span id="showAge"></span></p>
        <p>Months old: <span id="showMonths"></span></p>
        <p>Hobbies count: <span id="showCount"></span></p>
    </section>

    <section id="part2">
        <h2>Part 2. Form</h2>
        <form id="profileForm">
            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="birthYear">Birth Year</label>
            <input type="number" id="birthYear" min="1900" max="2026" required>

            <button type="submit">Create / Update Profile</button>
        </form>
    </section>

    <section id="part3">
        <h2>Part 3. Hobbies List</h2>
        <ul id="hobbyList">
            <li>Football</li>
            <li>Games</li>
            <li>Music</li>
        </ul>

        <input type="text" id="newItem" placeholder="New hobby">
        <button id="addBtn">Add Item</button>
        <button id="removeBtn">Remove Item</button>
    </section>

    <script src="script.js"></script>

</body>
</html>
